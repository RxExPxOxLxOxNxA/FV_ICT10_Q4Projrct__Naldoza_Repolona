<!DOCTYPE html>
<html>
<head>
<title>Attendance Tracker</title>
<link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
<script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<py-config>
packages = ["numpy", "matplotlib"]
</py-config>
<style>
body {
    font-family: 'PT Sans', Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 0;
}
header {
    background: #7B1C1C;
    color: white;
    text-align: center;
    padding: 30px;
}
header h1 { margin: 0; font-size: 2.5rem; }
header p { margin: 8px 0 0; font-size: 1rem; opacity: 0.85; }
nav {
    background: #5a1414;
    display: flex;
    justify-content: center;
}
nav a {
    color: white;
    text-decoration: none;
    padding: 14px 32px;
    font-weight: bold;
    font-size: 0.95rem;
    transition: background 0.2s;
}
nav a:hover { background: #7B1C1C; }
.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
    display: flex;
    gap: 30px;
    align-items: flex-start;
    flex-wrap: wrap;
}
.card {
    background: #e8d7b7;
    padding: 25px;
    width: 300px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}
h2 {
    color: black;
    margin-bottom: 20px;
}
label {
    font-weight: bold;
    font-size: 14px;
}
select, input {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
    outline: none;
    box-sizing: border-box;
    appearance: none;
    font-family: 'PT Sans', Arial, sans-serif;
}
button {
    width: 100%;
    padding: 12px;
    background: black;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-family: 'PT Sans', Arial, sans-serif;
    transition: 0.2s;
}
button:hover { background: #333; }
#output {
    background: white;
    padding: 20px;
    border-radius: 15px;
    flex: 1;
    min-width: 300px;
    min-height: 420px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    display: flex;
    justify-content: center;
    align-items: center;
}
footer {
    text-align: center;
    padding: 24px;
    color: #aaa;
    font-size: 0.85rem;
    margin-top: 60px;
    border-top: 1px solid #ddd;
}
</style>
</head>
<body>

<header>
  <h1>Grade 10 — Ruby</h1>
  <p>ICT10 Project &bull; Fourth Quarter &bull; AY 2025&ndash;2026</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="classmates.html">Classmate List</a>
  <a href="attendance.html">Attendance Tracker</a>
  <a href="photos.html">Class Photos</a>
</nav>

<div class="container">
  <div class="card">
    <h2>Attendance Tracker</h2>
    <label>Select Day</label>
    <select id="day">
      <option>Monday</option>
      <option>Tuesday</option>
      <option>Wednesday</option>
      <option>Thursday</option>
      <option>Friday</option>
    </select>
    <label>Absences</label>
    <input type="number" id="absences" placeholder="Enter number">
    <button py-click="add_data">Submit</button>
  </div>
  <div id="output"></div>
</div>

<py-script src="attendance.py"></py-script>

<footer>
  &copy; 2026 Grade 10-Ruby &bull; O.B. Montessori Center Fairview &bull; ICT10 Q4 Project
</footer>
</body>
</html>
